name: Build Swarasync APK

# Start it from the Actions tab: Build Swarasync APK -> Run workflow.
# It fetches the open-source BitChord project (GPLv3) at a fixed commit, applies
# swarasync-changes.patch from this repo on top, and builds an installable APK.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  UPSTREAM: https://github.com/kushagrasinghx/BitChord
  UPSTREAM_SHA: acf219a7e4a7f52f026d4336d5c7ac5cf7bfafcc
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (holds the patch)
        uses: actions/checkout@v4

      - name: Fetch BitChord and apply the Swarasync patch
        run: |
          git init -q src
          cd src
          git remote add origin "$UPSTREAM"
          git fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git checkout -q FETCH_HEAD
          git apply --whitespace=nowarn ../swarasync-changes.patch
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The dependable one: a normal debug build, signed with the debug key.
      - name: Build APK (debug)
        working-directory: src
        run: ./gradlew assembleProdDebug -Pbitchord.bundleWear=false --stacktrace

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: Swarasync-debug-apk
          path: src/app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error

      # Bonus: optimised build, smoother to use. If it fails, the debug APK is still good.
      - name: Build APK (optimised)
        id: optimised
        working-directory: src
        continue-on-error: true
        run: ./gradlew assembleProdBenchmark -Pbitchord.bundleWear=false --stacktrace

      - name: Upload APK (optimised)
        if: steps.optimised.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Swarasync-optimised-apk
          path: src/app/build/outputs/apk/prod/benchmark/*.apk
